description: Scripted real AgentLoop and local workspace integration smoke
providers:
  - id: file://workspace_provider.py
    label: pawbot-workspace-smoke
    config:
      mode: smoke
      workers: 1
      timeout: 60000
prompts:
  - "{{task}}"
tests:
  - description: Create and check a local tool event summary
    vars:
      case_id: workspace-log-summary
      split: smoke
      allow_simulation: true
      task: Create summary.json from the fixture log and run the public checks.
      script:
        - tool_calls:
            - id: write-summary
              name: write_file
              arguments:
                path: summary.json
                content: '{"total":4,"tools":{"read":{"calls":3,"errors":1,"duration_ms":25},"write":{"calls":1,"errors":0,"duration_ms":20}}}'
        - tool_calls:
            - id: check-summary
              name: run_project_tests
              arguments: {}
        - content: The summary was created and checked.
    assert:
      - type: javascript
        value: file://workspace_assertions.cjs:health
      - type: javascript
        value: file://workspace_assertions.cjs:trajectory
      - type: javascript
        value: file://workspace_assertions.cjs:outcome
evaluateOptions:
  repeat: 1
  maxConcurrency: 1
  cache: false
