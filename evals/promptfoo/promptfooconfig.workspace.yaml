description: Pawbot real local workspace tasks with external outcome checks
providers:
  - id: file://workspace_provider.py
    label: pawbot-workspace
    config:
      workers: 1
      timeout: 200000
      temperature: 0.1
      max_tokens: 2048
      max_iterations: 8
      max_tool_calls: 12
      max_wall_seconds: 120
      max_input_tokens: 32000
      max_output_tokens: 8192
prompts:
  - "{{task}}"
tests: file://workspace_cases.yaml
defaultTest:
  assert:
    - type: javascript
      value: file://workspace_assertions.cjs:health
      metric: runtime
    - type: javascript
      value: file://workspace_assertions.cjs:trajectory
      metric: trajectory
    - type: javascript
      value: file://workspace_assertions.cjs:outcome
      metric: outcome
evaluateOptions:
  repeat: 3
  maxConcurrency: 1
  cache: false
outputPath:
  - results/workspace-latest.json
  - results/workspace-latest.html
