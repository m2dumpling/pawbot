name: Publish package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag, after all matching TUI archives are uploaded
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish pawbot-ai
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          # A published release alone is insufficient: native sidecars must exist first.

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Verify tag version and matching native sidecars
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,assets > "$RUNNER_TEMP/pawbot-release-assets.json"
          uv run --no-project --python 3.11 python scripts/check_release.py \
            "$RELEASE_TAG" "$RUNNER_TEMP/pawbot-release-assets.json"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install WebUI dependencies
        working-directory: webui
        run: bun install --frozen-lockfile

      - name: Build WebUI
        working-directory: webui
        run: bun run build

      - name: Build wheel and sdist
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
