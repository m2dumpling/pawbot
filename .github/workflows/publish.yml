name: Publish package

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag; dispatch this workflow on the same tag
        required: true
        type: string
      operation:
        description: Prepare the distributions or publish a verified prepare run
        required: true
        type: choice
        options: [prepare, publish]
      prepare_run_id:
        description: Successful prepare run ID (required only for publish)
        required: false
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  prepare:
    name: Build and verify Python distributions
    if: inputs.operation == 'prepare' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Verify dispatch and tag
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            RELEASE_TAG="v$(uv run --no-project --python 3.11 python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          fi
          uv run --no-project --python 3.11 python scripts/check_release.py "$RELEASE_TAG"
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install and build WebUI
        working-directory: webui
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Build wheel and sdist
        run: uv build
      - name: Verify distributions and sdist rebuild
        shell: bash
        run: |
          set -eu
          version="${RELEASE_TAG#v}"
          uv run --no-project --python 3.11 python -m scripts.release_artifacts prepare \
            dist "$RELEASE_TAG" "$version" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY"
          uv build --wheel --out-dir "$RUNNER_TEMP/sdist-wheel" dist/*.tar.gz
          uv run --no-project --python 3.11 python -m scripts.release_artifacts distribution \
            "$RUNNER_TEMP"/sdist-wheel/*.whl "$version"
      - name: Install the prepared wheel in a clean environment
        shell: bash
        run: |
          set -eu
          uv venv "$RUNNER_TEMP/pawbot-release-venv" --python 3.11
          uv pip install --python "$RUNNER_TEMP/pawbot-release-venv/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pawbot-release-venv/bin/pawbot" --version
          "$RUNNER_TEMP/pawbot-release-venv/bin/python" -c \
            'import importlib.metadata, os, pawbot; from pathlib import Path; assert importlib.metadata.version("pawbot-ai") == os.environ["RELEASE_TAG"][1:]; assert Path(pawbot.__file__).resolve().is_relative_to(Path(os.environ["RUNNER_TEMP"]).resolve())'
      - name: Verify installed WebUI and settings transport
        shell: bash
        run: |
          uv sync --extra dev
          PAWBOT_SMOKE_PYTHON="$RUNNER_TEMP/pawbot-release-venv/bin/python" \
            uv run --no-sync pytest -q tests/webui/test_gateway_webui_smoke.py
      - name: Store the verified distributions and identity
        uses: actions/upload-artifact@v4
        with:
          name: pawbot-python-prepared
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish the verified distributions to PyPI
    if: inputs.operation == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Verify published GitHub Release and prepare run
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$PREPARE_RUN_ID" in ''|*[!0-9]*) echo 'A numeric prepare run ID is required' >&2; exit 1;; esac
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,assets > "$RUNNER_TEMP/release.json"
          uv run --no-project --python 3.11 python scripts/check_release.py "$RELEASE_TAG" "$RUNNER_TEMP/release.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARE_RUN_ID" > "$RUNNER_TEMP/prepare-run.json"
          uv run --no-project --python 3.11 python -m scripts.release_artifacts run \
            "$RUNNER_TEMP/prepare-run.json" "$PREPARE_RUN_ID" "$GITHUB_SHA" "$GITHUB_REPOSITORY"
      - name: Download and verify the published native assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/tui-assets"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'pawbot-tui-*.zip*' --dir "$RUNNER_TEMP/tui-assets"
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            uv run --no-project --python 3.11 python -m scripts.release_artifacts tui "$RUNNER_TEMP/tui-assets" "$target"
          done
      - name: Download the explicitly selected prepare artifact
        uses: actions/download-artifact@v4
        with:
          name: pawbot-python-prepared
          path: dist
          run-id: ${{ inputs.prepare_run_id }}
          github-token: ${{ github.token }}
      - name: Verify identity, checksums and bundled WebUI
        env:
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
        shell: bash
        run: |
          set -eu
          uv run --no-project --python 3.11 python -m scripts.release_artifacts verify \
            dist "$RELEASE_TAG" "${RELEASE_TAG#v}" "$GITHUB_SHA" "$PREPARE_RUN_ID" "$GITHUB_REPOSITORY"
          rm dist/release-manifest.json
      - name: Publish the exact verified files to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
