name: Publish native TUI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose TUI assets should be built
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    name: TUI ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-latest
            target: win32-x64

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install TUI dependencies
        working-directory: tui
        run: bun install --frozen-lockfile

      - name: Type check TUI
        working-directory: tui
        run: bun run check

      - name: TUI tests
        working-directory: tui
        run: bun test

      - name: Build native TUI
        working-directory: tui
        run: bun run build -- ${{ matrix.target }}

      - name: Generate target notices
        working-directory: tui
        run: bun scripts/release-notices.ts ${{ matrix.target }}

      - name: Package licensed release archive
        run: python tui/scripts/package-release.py ${{ matrix.target }}

      - name: Upload TUI archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: tui-${{ matrix.target }}
          path: |
            tui/dist/pawbot-tui-*.zip
            tui/dist/pawbot-tui-*.zip.sha256
          if-no-files-found: error

  upload:
    name: Attach TUI assets to Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download TUI archives
        uses: actions/download-artifact@v4
        with:
          pattern: tui-*
          merge-multiple: true
          path: tui-dist

      - name: Upload TUI assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          test -n "$RELEASE_TAG"
          test -n "$(find tui-dist -maxdepth 1 -name 'pawbot-tui-*.zip' -print -quit)"
          gh release upload "$RELEASE_TAG" tui-dist/pawbot-tui-*.zip tui-dist/pawbot-tui-*.zip.sha256 --clobber
