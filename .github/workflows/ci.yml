name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --all-extras --dev

      - name: Install channel dependencies
        run: uv run --no-sync python -m scripts.install_channel_dependencies --all-channels

      - name: Ruff
        run: uv run --no-sync ruff check pawbot

      - name: basedpyright
        run: uv run --no-sync basedpyright

      - name: Python tests
        run: uv run --no-sync pytest -q

  webui:
    name: WebUI
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        working-directory: webui
        run: bun install --frozen-lockfile

      - name: Frontend lint
        working-directory: webui
        run: bun run lint

      - name: Frontend tests
        working-directory: webui
        run: bun run test

      - name: Frontend build
        working-directory: webui
        run: bun run build

  package-smoke:
    name: Package smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Install the wheel into a clean environment
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/pawbot-release-venv" --python 3.11
          uv pip install --python "$RUNNER_TEMP/pawbot-release-venv/bin/python" dist/*.whl
          "$RUNNER_TEMP/pawbot-release-venv/bin/pawbot" --help
