name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --all-extras --dev

      - name: Install channel dependencies
        run: uv run --no-sync python -m scripts.install_channel_dependencies --all-channels

      - name: Ruff
        run: uv run --no-sync ruff check pawbot

      - name: basedpyright
        run: uv run --no-sync basedpyright

      - name: Python tests
        run: uv run --no-sync pytest -q --cov=pawbot --cov-report=term-missing --cov-fail-under=75

  webui:
    name: WebUI
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        working-directory: webui
        run: bun install --frozen-lockfile

      - name: Frontend lint
        working-directory: webui
        run: bun run lint

      - name: Frontend tests
        working-directory: webui
        run: bun run test

      - name: Frontend build
        working-directory: webui
        run: bun run build

  tui:
    name: Native TUI
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install TUI dependencies
        working-directory: tui
        run: bun install --frozen-lockfile

      - name: Type check TUI
        working-directory: tui
        run: bun run check

      - name: TUI tests
        working-directory: tui
        run: bun test

      - name: Build Linux x64 TUI
        working-directory: tui
        run: bun run build -- linux-x64

  package-smoke:
    name: Package smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Install the wheel into a clean environment
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/pawbot-release-venv" --python 3.11
          uv pip install --python "$RUNNER_TEMP/pawbot-release-venv/bin/python" dist/*.whl
          "$RUNNER_TEMP/pawbot-release-venv/bin/pawbot" --help

  installer-smoke:
    name: Installer smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Build a local wheel for the installer smoke test
        shell: bash
        env:
          PAWBOT_SKIP_WEBUI_BUILD: "1"
        run: uv build --wheel

      - name: Run POSIX installer and verify launcher
        if: runner.os != 'Windows'
        shell: bash
        env:
          PAWBOT_BIN_DIR: ${{ runner.temp }}/pawbot-bin
          PAWBOT_NO_PATH_UPDATE: "1"
          PAWBOT_SKIP_WIZARD: "1"
        run: |
          set -eu
          sh -n scripts/install.sh
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          PAWBOT_INSTALL_TARGET="$wheel" sh scripts/install.sh
          "$PAWBOT_BIN_DIR/pawbot" --version

      - name: Run Windows installer and verify launcher
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PAWBOT_BIN_DIR: ${{ runner.temp }}\pawbot-bin
          PAWBOT_NO_PATH_UPDATE: "1"
          PAWBOT_SKIP_WIZARD: "1"
        run: |
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          if (-not $wheel) { throw "No wheel was built" }
          $env:PAWBOT_INSTALL_TARGET = $wheel
          $scriptText = Get-Content scripts\install.ps1 -Raw
          [scriptblock]::Create($scriptText) | Out-Null
          & .\scripts\install.ps1
          & (Join-Path $env:PAWBOT_BIN_DIR "pawbot.cmd") --version

  record-replay:
    name: Record & Replay fixture
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --all-extras --dev

      - name: Replay sanitized fixture
        run: >-
          uv run --no-sync pytest -q
          tests/test_blackbox.py::test_public_sanitized_fixture_is_loadable
          tests/test_blackbox.py::test_record_then_replay_is_deterministic
